[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-platform"
version = "0.1.0"
description = "Auditable, provenance-preserving OCR and document dataset pipeline"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "OCR Platform Team" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.8,<3.0",
  "pymupdf>=1.24,<2.0",
  "pillow>=10.0,<13.0",
  "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0,<9.0",
  "httpx>=0.27,<1.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.8,<1.0",
]
vision = [
  "numpy>=1.26,<3.0",
  "opencv-python-headless>=4.10,<5.0",
]
paddle = [
  "paddleocr>=2.8,<4.0",
]
htr = [
  "torch>=2.2,<3.0",
  "transformers>=4.40,<5.0",
  "sentencepiece>=0.2,<1.0",
]
office = [
  "xlrd>=2.0,<3.0",
  "olefile>=0.47,<1.0",
]
distributed = [
  "redis>=5.0,<6.0",
  "boto3>=1.34,<2.0",
  "psycopg[binary]>=3.2,<4.0",
]
observability = [
  "opentelemetry-api>=1.25,<2.0",
  "opentelemetry-sdk>=1.25,<2.0",
]

[project.scripts]
ocr-platform = "ocr_platform.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "requires_pymupdf: requires PyMuPDF and PDF fixture support",
  "requires_api_deps: requires FastAPI/httpx dependencies",
  "benchmark: deterministic reference-backed OCR benchmark tests",
  "model: optional heavyweight OCR/HTR/table model tests",
  "gpu: optional GPU-backed benchmark tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["var", ".temp"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]




